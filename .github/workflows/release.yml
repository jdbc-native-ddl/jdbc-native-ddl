name: Release

on:
  push:
    tags: [ 'v*' ]

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
          server-id: central
          server-username: SONATYPE_USERNAME
          server-password: SONATYPE_PASSWORD

      - name: Import GPG key
        run: echo "${{ secrets.GPG_PRIVATE_KEY }}" | gpg --batch --import
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}

      - name: Cache NVD database
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository/org/owasp/dependency-check-data
          key: nvd-db-${{ github.run_id }}
          restore-keys: nvd-db-

      - name: Extract version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      - name: Build, test, and check vulnerabilities
        run: mvn clean verify -Drevision=${{ steps.version.outputs.VERSION }}
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}

      - name: Deploy to Maven Central
        run: mvn deploy -P release -DskipTests -Drevision=${{ steps.version.outputs.VERSION }}
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
          MAVEN_GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            target/jdbc-native-ddl-${{ steps.version.outputs.VERSION }}.jar
            target/jdbc-native-ddl-${{ steps.version.outputs.VERSION }}-sources.jar
            target/jdbc-native-ddl-${{ steps.version.outputs.VERSION }}-javadoc.jar
